name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact version number to publish (for example 0.1.1). Leave empty to bump automatically.'
        required: false
        type: string
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.release_version.outputs.latest_tag }}
      previous_tag: ${{ steps.release_version.outputs.previous_tag }}
      tag_exists: ${{ steps.release_version.outputs.tag_exists }}
      version_number: ${{ steps.release_version.outputs.version_number }}
      version_tag: ${{ steps.release_version.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: release_version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          INPUT_VERSION="${{ inputs.release_version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NUMBER="${INPUT_VERSION#v}"
            VERSION_TAG="v${VERSION_NUMBER}"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "${{ inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION_NUMBER="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_TAG="v${VERSION_NUMBER}"
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -Fxv "${VERSION_TAG}" | head -n 1 || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="$LATEST_TAG"
          fi

          {
            echo "latest_tag=$LATEST_TAG"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "tag_exists=$TAG_EXISTS"
            echo "version_number=$VERSION_NUMBER"
            echo "version_tag=$VERSION_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved release version: $VERSION_TAG"

  build-macos:
    name: Build macOS release artifacts
    needs: resolve-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout existing release source
        if: needs.resolve-version.outputs.tag_exists == 'true'
        shell: bash
        run: git checkout "${{ needs.resolve-version.outputs.version_tag }}"

      - name: Update package version for build
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild package install scripts
        run: pnpm rebuild electron esbuild better-sqlite3

      - name: Build macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build && pnpm exec electron-builder --mac --x64 --arm64 --publish never

      - name: List macOS artifacts
        shell: bash
        run: ls -lh release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-switch-macos-${{ needs.resolve-version.outputs.version_tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap

  build-windows:
    name: Build Windows release artifacts
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout existing release source
        if: needs.resolve-version.outputs.tag_exists == 'true'
        shell: bash
        run: git checkout "${{ needs.resolve-version.outputs.version_tag }}"

      - name: Update package version for build
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild package install scripts
        run: pnpm rebuild electron esbuild better-sqlite3

      - name: Build Windows artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build && pnpm exec electron-builder --win --x64 --publish never

      - name: List Windows artifacts
        shell: bash
        run: ls -lh release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-switch-windows-${{ needs.resolve-version.outputs.version_tag }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  publish-release:
    name: Publish GitHub Release and Homebrew cask
    needs:
      - resolve-version
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Show release artifacts
        shell: bash
        run: find release-dist -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Commit version bump and create tag
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          VERSION_NUMBER="${{ needs.resolve-version.outputs.version_number }}"
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${VERSION_NUMBER}"
          git tag "$VERSION_TAG"
          git push origin HEAD:main "$VERSION_TAG"
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Generate release notes body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          PREVIOUS_TAG="${{ needs.resolve-version.outputs.previous_tag }}"

          GENERATE_ARGS=(
            -f tag_name="$VERSION_TAG"
            -f target_commitish="$VERSION_TAG"
          )

          if [ "$PREVIOUS_TAG" != "$VERSION_TAG" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null 2>&1; then
            GENERATE_ARGS+=(-f previous_tag_name="$PREVIOUS_TAG")
            git log --no-merges --pretty=format:'- %s' "$PREVIOUS_TAG".."$VERSION_TAG" > "$RUNNER_TEMP/generated-commit-summary.md" || true
          else
            git log --no-merges --pretty=format:'- %s' "$VERSION_TAG" -n 50 > "$RUNNER_TEMP/generated-commit-summary.md" || true
          fi

          gh api repos/${{ github.repository }}/releases/generate-notes \
            "${GENERATE_ARGS[@]}" \
            --jq '.body' > "$RUNNER_TEMP/generated-release-notes-body.md"

      - name: Create release notes files
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          PREVIOUS_TAG="${{ needs.resolve-version.outputs.previous_tag }}"
          CLEAN_GENERATED_FILE="$RUNNER_TEMP/generated-release-notes-clean.md"

          sed \
            -e '/^<!-- Release notes generated using configuration /d' \
            -e '/^\*\*Full Changelog\*\*: /d' \
            "$RUNNER_TEMP/generated-release-notes-body.md" > "$CLEAN_GENERATED_FILE"

          {
            printf '%s\n' "## What's Changed"
            if grep -Eq '^- |^## ' "$CLEAN_GENERATED_FILE"; then
              cat "$CLEAN_GENERATED_FILE"
            elif [ -s "$RUNNER_TEMP/generated-commit-summary.md" ]; then
              cat "$RUNNER_TEMP/generated-commit-summary.md"
            else
              printf '%s\n' "- Maintenance release."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          {
            printf '\n%s\n' '## Artifacts'
            for artifact in release-dist/*; do
              [ -f "$artifact" ] || continue
              name=$(basename "$artifact")
              sha=$(shasum -a 256 "$artifact" | awk '{print $1}')
              printf '%s\n' "- \`$name\`"
              printf '%s\n' "  - SHA256: \`$sha\`"
            done
            printf '%s\n' '- `appcast.xml`'
            printf '%s\n' '  - Sparkle-compatible release metadata generated by this workflow'
            printf '\n%s\n' '## Update metadata'
            printf '%s\n' '- `latest-mac.yml` and `latest.yml` are consumed by electron-updater.'
            printf '%s\n' '- `appcast.xml` is published as Sparkle-compatible release metadata.'
            printf '\n%s\n' '## Notice'
            printf '%s\n' 'These artifacts are currently unsigned and not notarized. macOS users may need right-click/Open or Privacy & Security approval.'
            printf '\n%s\n' "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${VERSION_TAG}"
          } >> "$RUNNER_TEMP/release-notes.md"

          ruby -rcgi -e '
            markdown = File.read(ENV.fetch("RUNNER_TEMP") + "/release-notes.md")
            body = CGI.escapeHTML(markdown)
            html = <<~HTML
              <!doctype html>
              <html>
              <head>
                <meta charset="utf-8">
                <style>
                  body { font: -apple-system-body; margin: 0; padding: 0; color: -apple-system-label; }
                  pre { white-space: pre-wrap; word-wrap: break-word; font: -apple-system-body; }
                </style>
              </head>
              <body><pre>#{body}</pre></body>
              </html>
            HTML
            File.write(ENV.fetch("RUNNER_TEMP") + "/release-notes.html", html)
          '

          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create Sparkle-compatible appcast
        id: appcast
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          VERSION_NUMBER="${{ needs.resolve-version.outputs.version_number }}"
          DIST_DIR="$PWD/release-dist"
          APPCAST_PATH="$DIST_DIR/appcast.xml"
          PUB_DATE=$(LC_ALL=C TZ=UTC date -R)
          RELEASES_URL="https://github.com/${{ github.repository }}/releases"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$VERSION_TAG"
          RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/release-notes.html"
          RELEASE_NOTES_HTML="$RUNNER_TEMP/release-notes.html"

          VERSION_TAG="$VERSION_TAG" \
          VERSION_NUMBER="$VERSION_NUMBER" \
          DIST_DIR="$DIST_DIR" \
          APPCAST_PATH="$APPCAST_PATH" \
          PUB_DATE="$PUB_DATE" \
          RELEASES_URL="$RELEASES_URL" \
          RELEASE_URL="$RELEASE_URL" \
          RELEASE_NOTES_URL="$RELEASE_NOTES_URL" \
          RELEASE_NOTES_HTML="$RELEASE_NOTES_HTML" \
          REPOSITORY="${{ github.repository }}" \
          ruby <<'RUBY'
          require "rexml/document"
          require "shellwords"

          dist_dir = ENV.fetch("DIST_DIR")
          version_tag = ENV.fetch("VERSION_TAG")
          version_number = ENV.fetch("VERSION_NUMBER")
          notes_html = File.read(ENV.fetch("RELEASE_NOTES_HTML"))

          dmg_paths = Dir.glob(File.join(dist_dir, "auth-switch-#{version_number}-*.dmg")).sort
          abort "No macOS DMG artifacts found for appcast" if dmg_paths.empty?

          doc = REXML::Document.new
          doc << REXML::XMLDecl.new("1.0", "utf-8")
          rss = doc.add_element("rss", {
            "version" => "2.0",
            "xmlns:sparkle" => "http://www.andymatuschak.org/xml-namespaces/sparkle"
          })
          channel = rss.add_element("channel")
          channel.add_element("title").text = "auth-switch Updates"
          channel.add_element("description").text = "auth-switch release updates"
          channel.add_element("language").text = "en"
          channel.add_element("link").text = ENV.fetch("RELEASES_URL")

          dmg_paths.each do |path|
            name = File.basename(path)
            arch = name[/-(x64|arm64)\.dmg$/, 1] || "mac"
            item = channel.add_element("item")
            item.add_element("title").text = "auth-switch #{version_tag} (#{arch})"
            item.add_element("sparkle:version").text = version_number
            item.add_element("sparkle:shortVersionString").text = version_number
            item.add_element("sparkle:minimumSystemVersion").text = "11.0"
            item.add_element("pubDate").text = ENV.fetch("PUB_DATE")
            item.add_element("link").text = ENV.fetch("RELEASE_URL")
            item.add_element("sparkle:releaseNotesLink").text = ENV.fetch("RELEASE_NOTES_URL")
            item.add_element("sparkle:tags").text = arch
            description = item.add_element("description")
            description.add(REXML::CData.new(notes_html))
            item.add_element("enclosure", {
              "url" => "https://github.com/#{ENV.fetch("REPOSITORY")}/releases/download/#{version_tag}/#{name}",
              "type" => "application/octet-stream",
              "length" => File.size(path).to_s,
              "sparkle:sha256" => `shasum -a 256 #{path.shellescape}`.split.first
            })
          end

          formatter = REXML::Formatters::Pretty.new(2)
          formatter.compact = true
          File.open(ENV.fetch("APPCAST_PATH"), "w") do |file|
            formatter.write(doc, file)
            file.write("\n")
          end
          RUBY

          ruby -rrexml/document -e 'REXML::Document.new(File.read(ARGV.fetch(0)))' "$APPCAST_PATH"
          echo "appcast_path=$APPCAST_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          RELEASE_NAME="auth-switch ${VERSION_TAG}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release-dist/* "$RUNNER_TEMP/release-notes.html" --clobber
            gh release edit "$VERSION_TAG" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
          else
            CREATE_ARGS=()
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$VERSION_TAG" release-dist/* "$RUNNER_TEMP/release-notes.html" \
              --title "$RELEASE_NAME" \
              --notes-file "$NOTES_FILE" \
              "${CREATE_ARGS[@]}"
          fi

      - name: Update Homebrew Tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_NUMBER="${{ needs.resolve-version.outputs.version_number }}"
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          ARM_DMG="release-dist/auth-switch-${VERSION_NUMBER}-arm64.dmg"
          X64_DMG="release-dist/auth-switch-${VERSION_NUMBER}-x64.dmg"

          if [ -z "$TAP_REPO_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set. Failing because tap update is required."
            exit 1
          fi
          if [ ! -f "$ARM_DMG" ] || [ ! -f "$X64_DMG" ]; then
            echo "Expected both arm64 and x64 DMG artifacts for Homebrew cask update."
            exit 1
          fi

          ARM_SHA=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "$X64_DMG" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_REPO_TOKEN}@github.com/SHLE1/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cat > tap-repo/Casks/auth-switch.rb <<EOF
          cask "auth-switch" do
            arch arm: "arm64", intel: "x64"

            version "${VERSION_NUMBER}"

            if Hardware::CPU.arm?
              sha256 "${ARM_SHA}"
            else
              sha256 "${X64_SHA}"
            end

            url "https://github.com/SHLE1/auth-switch/releases/download/${VERSION_TAG}/auth-switch-#{version}-#{arch}.dmg"
            name "auth-switch"
            desc "Local desktop app for switching OpenAI Codex auth.json accounts"
            homepage "https://github.com/SHLE1/auth-switch"

            app "auth-switch.app"
          end
          EOF

          ruby -c tap-repo/Casks/auth-switch.rb
          git -C tap-repo config user.name "github-actions[bot]"
          git -C tap-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap-repo add Casks/auth-switch.rb
          if git -C tap-repo diff --cached --quiet; then
            echo "Homebrew tap is already up to date."
            exit 0
          fi
          git -C tap-repo commit -m "chore: update auth-switch cask to ${VERSION_TAG}"
          git -C tap-repo push origin HEAD
