name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact version number to publish (for example 0.1.1). Leave empty to bump automatically.'
        required: false
        type: string
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.release_version.outputs.latest_tag }}
      previous_tag: ${{ steps.release_version.outputs.previous_tag }}
      tag_exists: ${{ steps.release_version.outputs.tag_exists }}
      version_number: ${{ steps.release_version.outputs.version_number }}
      version_tag: ${{ steps.release_version.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: release_version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          INPUT_VERSION="${{ inputs.release_version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NUMBER="${INPUT_VERSION#v}"
            VERSION_TAG="v${VERSION_NUMBER}"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "${{ inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION_NUMBER="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_TAG="v${VERSION_NUMBER}"
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -Fxv "${VERSION_TAG}" | head -n 1 || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="$LATEST_TAG"
          fi

          {
            echo "latest_tag=$LATEST_TAG"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "tag_exists=$TAG_EXISTS"
            echo "version_number=$VERSION_NUMBER"
            echo "version_tag=$VERSION_TAG"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS release artifacts
    needs: resolve-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout existing release source
        if: needs.resolve-version.outputs.tag_exists == 'true'
        shell: bash
        run: git checkout "${{ needs.resolve-version.outputs.version_tag }}"

      - name: Update package version for build
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
          node -e 'const fs=require("fs"); const path="src-tauri/tauri.conf.json"; const cfg=JSON.parse(fs.readFileSync(path,"utf8")); cfg.version=process.env.VERSION_NUMBER; fs.writeFileSync(path, JSON.stringify(cfg, null, 2)+"\n");'
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build macOS DMG
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-switch-macos-${{ needs.resolve-version.outputs.version_tag }}
          path: |
            release/*.dmg

  build-windows:
    name: Build Windows release artifacts
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout existing release source
        if: needs.resolve-version.outputs.tag_exists == 'true'
        shell: bash
        run: git checkout "${{ needs.resolve-version.outputs.version_tag }}"

      - name: Update package version for build
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
          node -e 'const fs=require("fs"); const path="src-tauri/tauri.conf.json"; const cfg=JSON.parse(fs.readFileSync(path,"utf8")); cfg.version=process.env.VERSION_NUMBER; fs.writeFileSync(path, JSON.stringify(cfg, null, 2)+"\n");'
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        run: pnpm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-switch-windows-${{ needs.resolve-version.outputs.version_tag }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish GitHub Release and Homebrew cask
    needs:
      - resolve-version
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Show release artifacts
        shell: bash
        run: find release-dist -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Commit version bump and create tag
        if: needs.resolve-version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          VERSION_NUMBER="${{ needs.resolve-version.outputs.version_number }}"
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.version=process.env.VERSION_NUMBER; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2)+"\n");'
          node -e 'const fs=require("fs"); const path="src-tauri/tauri.conf.json"; const cfg=JSON.parse(fs.readFileSync(path,"utf8")); cfg.version=process.env.VERSION_NUMBER; fs.writeFileSync(path, JSON.stringify(cfg, null, 2)+"\n");'
          git add package.json src-tauri/tauri.conf.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${VERSION_NUMBER}"
          git tag "$VERSION_TAG"
          git push origin HEAD:main "$VERSION_TAG"
        env:
          VERSION_NUMBER: ${{ needs.resolve-version.outputs.version_number }}

      - name: Generate release notes body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          PREVIOUS_TAG="${{ needs.resolve-version.outputs.previous_tag }}"

          GENERATE_ARGS=(-f tag_name="$VERSION_TAG" -f target_commitish="$VERSION_TAG")
          if [ "$PREVIOUS_TAG" != "$VERSION_TAG" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null 2>&1; then
            GENERATE_ARGS+=(-f previous_tag_name="$PREVIOUS_TAG")
            git log --no-merges --pretty=format:'- %s' "$PREVIOUS_TAG".."$VERSION_TAG" > "$RUNNER_TEMP/generated-commit-summary.md" || true
          else
            git log --no-merges --pretty=format:'- %s' "$VERSION_TAG" -n 50 > "$RUNNER_TEMP/generated-commit-summary.md" || true
          fi

          gh api repos/${{ github.repository }}/releases/generate-notes "${GENERATE_ARGS[@]}" --jq '.body' > "$RUNNER_TEMP/generated-release-notes-body.md"

      - name: Create release notes file
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          PREVIOUS_TAG="${{ needs.resolve-version.outputs.previous_tag }}"
          CLEAN_GENERATED_FILE="$RUNNER_TEMP/generated-release-notes-clean.md"

          sed -e '/^<!-- Release notes generated using configuration /d' -e '/^\*\*Full Changelog\*\*: /d' "$RUNNER_TEMP/generated-release-notes-body.md" > "$CLEAN_GENERATED_FILE"

          if [ -s "$CLEAN_GENERATED_FILE" ]; then
            if grep -Fq "## What's Changed" "$CLEAN_GENERATED_FILE"; then
              cat "$CLEAN_GENERATED_FILE" > "$RUNNER_TEMP/release-notes.md"
            else
              { printf '%s\n\n' "## What's Changed"; cat "$CLEAN_GENERATED_FILE"; } > "$RUNNER_TEMP/release-notes.md"
            fi
          elif [ -s "$RUNNER_TEMP/generated-commit-summary.md" ]; then
            { printf '%s\n\n' "## What's Changed"; cat "$RUNNER_TEMP/generated-commit-summary.md"; } > "$RUNNER_TEMP/release-notes.md"
          else
            { printf '%s\n\n' "## What's Changed"; printf '%s\n' "- Maintenance release."; } > "$RUNNER_TEMP/release-notes.md"
          fi

          {
            printf '\n%s\n' '## Artifacts'
            for artifact in release-dist/*; do
              [ -f "$artifact" ] || continue
              name=$(basename "$artifact")
              sha=$(shasum -a 256 "$artifact" | awk '{print $1}')
              printf '%s\n' "- \`$name\`"
              printf '%s\n' "  - SHA256: \`$sha\`"
            done
            printf '\n%s\n' '## Notice'
            printf '%s\n' 'These Tauri artifacts are currently unsigned and not notarized. macOS users may need right-click/Open or Privacy & Security approval.'
            printf '%s\n' 'auth-switch is local-only and does not include in-app network update checks.'
            if [ "$PREVIOUS_TAG" != "$VERSION_TAG" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null 2>&1; then
              printf '\n%s\n' "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${VERSION_TAG}"
            else
              printf '\n%s\n' "**Initial release**: ${VERSION_TAG}"
            fi
          } >> "$RUNNER_TEMP/release-notes.md"

          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          RELEASE_NAME="auth-switch ${VERSION_TAG}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release-dist/* --clobber
            gh release edit "$VERSION_TAG" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
          else
            CREATE_ARGS=()
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$VERSION_TAG" release-dist/* --title "$RELEASE_NAME" --notes-file "$NOTES_FILE" "${CREATE_ARGS[@]}"
          fi

      - name: Update Homebrew Tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_NUMBER="${{ needs.resolve-version.outputs.version_number }}"
          VERSION_TAG="${{ needs.resolve-version.outputs.version_tag }}"
          ARM_DMG="release-dist/auth-switch-${VERSION_NUMBER}-arm64.dmg"
          X64_DMG="release-dist/auth-switch-${VERSION_NUMBER}-x64.dmg"

          if [ -z "$TAP_REPO_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set. Failing because tap update is required."
            exit 1
          fi
          if [ ! -f "$ARM_DMG" ] || [ ! -f "$X64_DMG" ]; then
            echo "Expected both arm64 and x64 DMG artifacts for Homebrew cask update."
            exit 1
          fi

          ARM_SHA=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "$X64_DMG" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_REPO_TOKEN}@github.com/SHLE1/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cat > tap-repo/Casks/auth-switch.rb <<EOF
          cask "auth-switch" do
            arch arm: "arm64", intel: "x64"

            version "${VERSION_NUMBER}"

            if Hardware::CPU.arm?
              sha256 "${ARM_SHA}"
            else
              sha256 "${X64_SHA}"
            end

            url "https://github.com/SHLE1/auth-switch/releases/download/${VERSION_TAG}/auth-switch-#{version}-#{arch}.dmg"
            name "auth-switch"
            desc "Local desktop app for switching OpenAI Codex auth.json accounts"
            homepage "https://github.com/SHLE1/auth-switch"

            app "auth-switch.app"
          end
          EOF

          ruby -c tap-repo/Casks/auth-switch.rb
          git -C tap-repo config user.name "github-actions[bot]"
          git -C tap-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap-repo add Casks/auth-switch.rb
          if git -C tap-repo diff --cached --quiet; then
            echo "Homebrew tap is already up to date."
            exit 0
          fi
          git -C tap-repo commit -m "chore: update auth-switch cask to ${VERSION_TAG}"
          git -C tap-repo push origin HEAD
