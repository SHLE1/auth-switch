appId: com.authswitch.app
productName: auth-switch
files:
  - out/**
  - assets/**
  - package.json
directories:
  output: release
npmRebuild: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
mac:
  target:
    - dmg
  category: public.app-category.utilities
  icon: assets/icon.png
win:
  target:
    - nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
