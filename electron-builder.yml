appId: com.authswitch.app
productName: auth-switch
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - out/**
  - assets/**
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - tray-icon*.png
directories:
  output: release
npmRebuild: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
publish:
  provider: github
  owner: SHLE1
  repo: auth-switch
  releaseType: release
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
